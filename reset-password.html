<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="ABM.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir Senha — Academia Bombeiro Militar</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="screen-reset-pw">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-emblem" style="flex-direction:column;align-items:center;gap:12px;">
        <img src="ABM.png" alt="Brasão ABM" style="width:80px;height:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));" />
        <div style="text-align:center;">
          <div class="login-sub">Academia Bombeiro Militar</div>
          <div class="login-sub" style="color:var(--accent);letter-spacing:1px;">Redefinir Senha</div>
        </div>
      </div>

      <div class="alert error" id="reset-pw-error"></div>
      <div class="alert success" id="reset-pw-success"></div>

      <div id="reset-pw-form">
        <div class="field">
          <label>Nova Senha</label>
          <input type="password" id="reset-pw-new" placeholder="mínimo 8 caracteres" autocomplete="new-password" />
        </div>
        <div class="field">
          <label>Confirmar Nova Senha</label>
          <input type="password" id="reset-pw-confirm" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <button class="btn btn-primary btn-full" id="btn-reset-pw-submit">REDEFINIR SENHA</button>
      </div>

      <div style="text-align:center;margin-top:16px;">
        <a href="index.html" style="font-size:12px;color:var(--muted);text-decoration:underline;">Voltar ao login</a>
      </div>
    </div>
  </div>
</div>

<script>
  // Local (127.0.0.1/localhost) aponta pra API rodando localmente; qualquer
  // outro host (produção) continua usando a API oficial - sem build step
  // nesse frontend, então não há process.env/variável de ambiente real.
  const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://127.0.0.1:8000'
    : 'https://api.cfo-cbmpa.com.br';
  const $ = id => document.getElementById(id);

  function showAlert(id, msg, type = 'error') {
    const el = $(id);
    el.textContent = msg;
    el.className = `alert ${type} show`;
  }
  function hideAlert(id) { $(id).className = 'alert'; }

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    showAlert('reset-pw-error', 'Link de recuperação inválido. Solicite um novo link na tela de login.');
    $('reset-pw-form').style.display = 'none';
  }

  async function handleResetPw() {
    hideAlert('reset-pw-error');
    hideAlert('reset-pw-success');

    const new_password = $('reset-pw-new').value;
    const confirm       = $('reset-pw-confirm').value;

    if (!new_password || !confirm) {
      showAlert('reset-pw-error', 'Preencha todos os campos.');
      return;
    }
    if (new_password.length < 8) {
      showAlert('reset-pw-error', 'Mínimo 8 caracteres.');
      return;
    }
    if (new_password !== confirm) {
      showAlert('reset-pw-error', 'As senhas não coincidem.');
      return;
    }

    const btn = $('btn-reset-pw-submit');
    btn.classList.add('btn-loading');
    btn.textContent = 'AGUARDE...';

    try {
      const res = await fetch(`${API}/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password }),
      });
      const data = await res.json();

      if (!res.ok) {
        showAlert('reset-pw-error', data.detail || 'Erro ao redefinir senha.');
        return;
      }

      showAlert('reset-pw-success', data.message, 'success');
      $('reset-pw-form').style.display = 'none';

    } catch {
      showAlert('reset-pw-error', 'Não foi possível conectar à API.');
    } finally {
      btn.classList.remove('btn-loading');
      btn.textContent = 'REDEFINIR SENHA';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    $('btn-reset-pw-submit').addEventListener('click', handleResetPw);
    $('reset-pw-confirm').addEventListener('keydown', e => { if (e.key === 'Enter') handleResetPw(); });
  });
</script>

</body>
</html>
